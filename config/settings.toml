# Tengen-Toppa settings. Edit, then restart the worker.

[search]
title_include = ["ai engineer", "ai software engineer", "llm", "machine learning", "ml engineer", "data science", "python"]
title_exclude = ["intern", "senior", "sr", "lead", "principal", "staff", "director", "manager"]
locations = ["gurugram", "gurgaon", "india", "remote"]
allow_remote = true
company_blacklist = []
max_years_gap = 2              # skip if JD asks for > your years + this
needs_visa_sponsorship = false

# Public ATS job boards (the slug from the company's careers URL)
[sources.greenhouse]
boards = ["stripe", "databricks"]   # boards.greenhouse.io/<slug>

[sources.lever]
companies = []                      # jobs.lever.co/<slug>

[sources.ashby]
boards = []                         # jobs.ashbyhq.com/<slug>

[pipeline]
discover_every_hours = 4
analyze_per_run = 25          # top-N jobs (after free local prefilter) sent to Claude
min_score = 70                # below this, job is skipped
daily_tailor_cap = 20         # protects your Claude subscription limits
auto_apply_threshold = 0      # 0 = always ask on WhatsApp
allow_project_reorder = false # projects are always locked; this only allows reordering
max_bullets_per_role = 5

[llm]
analyze_model = "haiku"
tailor_model = "sonnet"
timeout_seconds = 300
max_tailor_attempts = 3

[whatsapp]
graph_version = "v23.0"
digest_template = "tengen_daily_digest"   # approved utility template, 1 body param: job count
alert_template = "tengen_alert"           # approved utility template, 1 body param: text
template_language = "en"
digest_hour = 9

# Facts used to fill application forms. Used verbatim, never invented.
# Anything a form asks that isn't here or in the Q&A bank is asked on WhatsApp and remembered.
[applicant]
country = "India"
work_authorized = true
requires_sponsorship = false
work_authorized_countries = ["India"]   # only India without sponsorship; add a country only if your passport/visa allows it
notice_period = ""           # not on the resume: blank = asked once on WhatsApp, then remembered
earliest_start = ""
current_ctc = ""
expected_ctc = ""
willing_to_relocate = true   # CONFIRM
open_to_remote = true        # CONFIRM
how_did_you_hear = ""
pronouns = ""
gender = ""
race_ethnicity = ""
veteran_status = ""
disability_status = ""

[apply]
mode = "auto_fill"          # "assist" = only open the page + reveal the resume
auto_submit = false         # false = fill everything, send you a screenshot, YOU click submit on the Mac
cdp_port = 9333             # dedicated Chrome profile (data/browser-profile) driven over CDP
browser = "chrome"          # "chrome" (installed Google Chrome) or "chromium" (Playwright's)
claude_fallback = true      # unknown sites: Claude Code + Playwright MCP fills the form (never submits)
fallback_max_turns = 40
cover_letter = "when_field_present"   # "always" | "never"

[email]
enabled = false             # track replies (interview / rejection / assessment) over IMAP
imap_host = "imap.gmail.com"
address = ""                # Gmail: create an App Password, then `tengen secrets set email_app_password`
poll_minutes = 30
lookback_days = 3

# ---------------- LinkedIn Easy Apply (v1.1) ----------------

# Your own statement of experience. Used verbatim for "years with X" questions; never inferred.
[experience]
total_years = 1
verified_skill_years = 1      # every skill in skills_verified
ai_skill_years = 1            # every term in ai_terms below (you: "1+ year across AI technologies")
max_years_required = 1        # only apply when the job asks for at most this many years
# Remove anything you have NOT worked with; forms will answer "1 year / Yes" for every term listed here.
ai_terms = ["AI", "artificial intelligence", "machine learning", "ML", "deep learning", "LLM", "LLMs",
  "large language models", "generative AI", "GenAI", "NLP", "natural language processing", "RAG",
  "retrieval-augmented generation", "vector database", "vector databases", "embeddings", "LangChain",
  "LangGraph", "LlamaIndex", "Hugging Face", "Transformers", "prompt engineering", "fine-tuning", "LoRA",
  "PEFT", "RLHF", "SFT", "AI agents", "agentic AI", "MCP", "Model Context Protocol", "OpenAI", "GPT",
  "Claude", "Gemini", "Llama", "MLOps", "LLMOps", "PyTorch", "TensorFlow", "Keras", "scikit-learn",
  "XGBoost", "computer vision", "Pandas", "NumPy"]
# skills = { Kubernetes = 0 }   # per-skill overrides (anything not listed is asked once on WhatsApp)

[linkedin]
enabled = true
mode = "review"               # "review": you approve each job + tap Submit (test flight). "auto": fully autonomous.
keywords = ["AI Engineer", "LLM Engineer", "Machine Learning Engineer", "Generative AI", "AI Software Engineer",
  "Python Developer", "Data Scientist"]
locations = ["India", "Gurugram", "Delhi", "Bengaluru", "Hyderabad", "Pune", "Mumbai", "Chennai", "Noida"]
experience_levels = ["entry", "associate"]
workplace = ["onsite", "remote", "hybrid"]
pool_target = 500             # standing pool of eligible Easy Apply jobs
first_fill_days = 7           # first fill reads the past week; later runs only the past 24h
max_pages_per_search = 8
max_pages_per_run = 40
page_delay_seconds = 4
max_applications_per_day = 30 # hard cap, checked at the moment of submit
max_per_hour = 10
apply_interval_seconds = 90
windows = ["10:00", "14:00", "18:00"]
per_window = 10
auto_schedule = false         # true: start a run of `per_window` at each window (auto mode only)
stop_after_consecutive_failures = 5
follow_company = false
resume_display_name = "Kanishk_Singh_Parihar_Resume.pdf"
dedupe_days = 30
status_sync_hours = [9, 21]
max_steps = 10

[dashboard]
interval_minutes = 3
only_when_changed = true
commands_offline_pause_minutes = 10
